name: Release Crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: The exact version to release (e.g., 0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Releases must be made from master, not $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3."
            exit 1
          fi

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Push the commit and tag made by cargo-release
      id-token: write # Authenticate to crates.io with trusted publishing
    # Actions are pinned to commits, since this job can publish the crate and push to the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cargo-release looks at existing tags.
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Release and publish
        working-directory: opener
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: cargo release "$VERSION" --execute --no-confirm
