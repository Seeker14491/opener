name: CI

on:
  push:
    # Dependabot's branches are checked by their pull requests. Listing branches also skips tag pushes.
    branches-ignore: ["dependabot/**"]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, so a release is only made from a commit that passes CI.
  workflow_call:
  schedule:
    # Weekly, to catch breakage from new Rust releases and new dependency versions.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for a pull request; other runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-features

  clippy:
    name: Clippy (${{ matrix.target || matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
          # Targets without a runner, checked from Linux. FreeBSD covers the code for Unix platforms
          # other than Linux and macOS, and 32-bit Windows has different Win32 integer and pointer
          # sizes.
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
          - os: ubuntu-latest
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Clippy (default features)
        run: cargo clippy -p opener --all-targets ${{ matrix.target && format('--target {0}', matrix.target) }} -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features ${{ matrix.target && format('--target {0}', matrix.target) }} -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Resolves with a newer Cargo, whose resolver can pick dependency versions that support
      # `opener`'s `rust-version`. Cargo 1.77 would pick the newest versions, which need newer Rust.
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve dependencies for the MSRV
        run: cargo generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      # Keep in sync with `rust-version` in opener/Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.120
        with:
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin, x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
      # Checking doesn't need the targets' linkers, so every platform is covered from Linux.
      - name: Check
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin \
              x86_64-unknown-freebsd; do
            cargo check -p opener --all-targets --locked --target "$target"
            cargo check -p opener --all-targets --all-features --locked --target "$target"
          done

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: dtolnay/install@cargo-docs-rs
      - uses: Swatinem/rust-cache@v2
      # Builds with the same toolchain, features and flags as docs.rs.
      - name: Build docs as docs.rs does
        run: cargo docs-rs -p opener

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Nightly, since rustfmt.toml uses unstable options.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
